[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurax"
version = "4.0.0"
description = "Ultra-lightweight GPU-Accelerated Minecraft Launcher with Glassmorphism UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.11.0",
    "minecraft-launcher-lib>=8.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "keyring>=25.7.0",
    "Pillow>=9.5.0",
    "pypresence>=4.3.0",
    "mcstatus>=11.0.0",
    "markdown>=3.4.0"
]

[project.scripts]
neurax = "neurax.app:main"
